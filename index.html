<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mural — quadro Kanban local</title>
<meta name="description" content="Quadro Kanban local, offline-first, com tema Vercel.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FCFCFC" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mural">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.5/index.css" rel="stylesheet">
<style>
:root {
  /* tema "vercel" (tweakcn), portado para as variáveis do app */
  --bg: oklch(0.9900 0 0);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.9400 0 0);
  --text: oklch(0 0 0);
  --text-dim: oklch(0.4400 0 0);
  --border: oklch(0.9200 0 0);
  --accent: oklch(0 0 0);
  --accent-2: oklch(0.5500 0.2200 264.5300);
  --danger: oklch(0.6300 0.1900 23.0300);
  --success: oklch(0.5500 0.1700 145);
  --radius: 0.5rem;
  --font-display: "Geist Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Geist Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "Courier New", monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0 0 0);
    --surface: oklch(0.1400 0 0);
    --surface-2: oklch(0.2300 0 0);
    --text: oklch(1 0 0);
    --text-dim: oklch(0.7200 0 0);
    --border: oklch(0.2600 0 0);
    --accent: oklch(1 0 0);
    --accent-2: oklch(0.5800 0.2100 260.8400);
    --danger: oklch(0.6900 0.2000 23.9100);
    --success: oklch(0.7000 0.1700 145);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0 0 0);
  --surface: oklch(0.1400 0 0);
  --surface-2: oklch(0.2300 0 0);
  --text: oklch(1 0 0);
  --text-dim: oklch(0.7200 0 0);
  --border: oklch(0.2600 0 0);
  --accent: oklch(1 0 0);
  --accent-2: oklch(0.5800 0.2100 260.8400);
  --danger: oklch(0.6900 0.2000 23.9100);
  --success: oklch(0.7000 0.1700 145);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }

#app { display: flex; height: 100vh; width: 100vw; }

/* ---------- sidebar ---------- */
#sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--surface-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  overflow-y: auto;
}
.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 19px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
#boardTabs { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.board-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 8px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid transparent;
}
.board-tab:hover { background: var(--surface); }
.board-tab.active { background: var(--surface); border-color: var(--border); }
.board-tab.active .tab-name { color: var(--accent); font-weight: 600; }
.tab-index { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.tab-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-del { opacity: 0; }
.board-tab:hover .tab-del { opacity: 0.6; }
.tab-del:hover { opacity: 1 !important; color: var(--danger); }
.empty-hint { color: var(--text-dim); font-size: 13px; padding: 8px 4px; }

#sidebar > button[data-action="new-board"] {
  margin-top: 10px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 9px 8px;
  color: var(--text-dim);
  text-align: left;
}
#sidebar > button[data-action="new-board"]:hover { border-color: var(--accent); color: var(--accent); }

.sidebar-footer { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
#themeToggle {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
}

/* ---------- main / topbar ---------- */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar {
  padding: 16px 22px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
#topbar.hidden { display: none; }
#boardTitleInput {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  background: transparent;
  border: none;
  outline: none;
  padding: 2px 4px;
  width: 100%;
  max-width: 480px;
  color: var(--text);
}
#boardTitleInput:focus { background: var(--surface-2); border-radius: 6px; }
.toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.toolbar input, .toolbar select {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
}
#searchInput { min-width: 200px; flex: 1; max-width: 280px; }
.toolbar button {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 12px;
  color: var(--text-dim);
}
.toolbar button:hover { color: var(--danger); border-color: var(--danger); }

/* ---------- board lists ---------- */
#boardLists {
  flex: 1;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 18px 22px;
  overflow-x: auto;
  overflow-y: hidden;
}
#emptyState {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: var(--text-dim);
}
#emptyState.hidden { display: none; }
#emptyState button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-weight: 600;
}

.list-column {
  width: 270px;
  min-width: 270px;
  max-height: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
}
.list-column.dragging { opacity: 0.4; }
.list-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 8px 8px 4px;
}
.drag-handle { cursor: grab; color: var(--text-dim); padding: 2px 4px; }
.list-name-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  min-width: 0;
  border-radius: 4px;
  padding: 3px 4px;
}
.list-name-input:focus { background: var(--surface); }
.list-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.icon-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 2px 6px;
  border-radius: 4px;
  line-height: 1;
}
.icon-btn:hover { color: var(--danger); background: var(--surface); }

.list-cards {
  flex: 1;
  overflow-y: auto;
  padding: 2px 8px 4px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 20px;
}

.add-card-btn, .add-list-btn {
  background: transparent;
  border: none;
  text-align: left;
  color: var(--text-dim);
  padding: 9px 12px;
  border-radius: 6px;
  margin: 2px 6px 8px;
}
.add-card-btn:hover { background: var(--surface); color: var(--accent); }
.add-list-btn {
  width: 220px;
  min-width: 220px;
  height: 44px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  margin: 0;
  align-self: flex-start;
}
.add-list-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- cards ---------- */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: grab;
  overflow: hidden;
}
.card:hover { border-color: var(--accent); }
.card.dragging { opacity: 0.35; }
.card.hidden { display: none; }
.card.card-done .card-title { text-decoration: line-through; color: var(--text-dim); }
.priority-flag {
  position: absolute;
  top: 0;
  left: 0;
  width: 6px;
  height: 100%;
}
.card-cover { width: 100%; height: 84px; object-fit: cover; display: block; }
.card-body { padding: 10px 12px 10px 16px; display: flex; flex-direction: column; gap: 6px; }
.card-labels { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font-size: 10.5px;
  font-weight: 600;
  color: white;
  padding: 2px 8px;
  border-radius: 20px;
}
.card-title { margin: 0; line-height: 1.35; }
.card-checklist { display: flex; align-items: center; gap: 8px; }
.progress { flex: 1; height: 5px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); }
.checklist-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 5px; font-weight: 600; }
.badge-neutral { background: var(--surface-2); color: var(--text-dim); }
.badge-warn { background: #F0B15A33; color: var(--accent-2); }
.badge-danger { background: #A3392F26; color: var(--danger); }
.badge-done { background: #3E7A4A26; color: var(--success); }
.meta-pill { font-size: 11px; color: var(--text-dim); }

/* ---------- modal ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 18, 15, 0.55);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 5vh 16px;
  overflow-y: auto;
  z-index: 50;
}
.overlay.hidden { display: none; }
#cardModal {
  background: var(--surface);
  border-radius: 12px;
  width: 100%;
  max-width: 720px;
  padding: 22px 26px 26px;
  border: 1px solid var(--border);
}
.modal-header { display: flex; align-items: flex-start; gap: 10px; }
.modal-title-input {
  flex: 1;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  background: transparent;
  border: none;
  outline: none;
  padding: 4px;
  border-radius: 6px;
  color: var(--text);
}
.modal-title-input:focus { background: var(--surface-2); }
.modal-sub { color: var(--text-dim); font-size: 12.5px; margin: 4px 0 18px 4px; }
.modal-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 26px; }
@media (max-width: 640px) { .modal-grid { grid-template-columns: 1fr; } }
.field-label {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-dim);
  margin: 16px 0 6px;
}
.field-label:first-child { margin-top: 0; }
#cmDesc {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  resize: vertical;
}
.checklist-items { display: flex; flex-direction: column; gap: 6px; }
.checklist-item { display: flex; align-items: center; gap: 8px; }
.checklist-item span { flex: 1; }
.checklist-item span.done { text-decoration: line-through; color: var(--text-dim); }
.inline-form { display: flex; gap: 6px; margin-top: 8px; }
.inline-form.stacked { flex-direction: column; align-items: flex-start; }
.inline-form input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
}
.inline-form button {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 12px;
  color: var(--text-dim);
}
.inline-form button:hover { color: var(--accent); border-color: var(--accent); }

.attachments { display: flex; flex-wrap: wrap; gap: 8px; }
.attachment { position: relative; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
.attachment img { width: 100%; height: 100%; object-fit: cover; display: block; }
.att-del {
  position: absolute; top: 0; right: 0; background: rgba(0,0,0,0.6); color: white; font-size: 10px; padding: 1px 4px; border-radius: 0 0 0 6px;
}
.attachment-add {
  width: 64px; height: 64px;
  border: 1px dashed var(--border);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim);
  font-size: 20px;
  cursor: pointer;
}
.attachment-add:hover { border-color: var(--accent); color: var(--accent); }

.modal-side select, .modal-side input[type="date"] {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
}
.checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
.label-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-toggle {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 10px 5px 6px;
  font-size: 12.5px;
  color: var(--text-dim);
}
.chip-toggle.active { border-color: var(--chip-color); color: var(--text); background: color-mix(in srgb, var(--chip-color) 16%, var(--surface-2)); }
.chip-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.swatches { display: flex; gap: 6px; margin: 4px 0; }
.swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.swatch.active { border-color: var(--text); }
.danger-btn {
  width: 100%;
  margin-top: 22px;
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: 8px;
  padding: 9px;
  font-weight: 600;
}
.danger-btn:hover { background: var(--danger); color: white; }

/* ---------- scrollbars ---------- */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- responsive ---------- */
@media (max-width: 780px) {
  #sidebar { width: 76px; min-width: 76px; padding: 14px 6px; }
  .brand span, .tab-name, .tab-index { display: none; }
  .board-tab { justify-content: center; }
  .tab-del { display: none; }
  #sidebar > button[data-action="new-board"] { text-align: center; }
}

</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">🗂️ <span>Mural</span></div>
    <div id="boardTabs"></div>
    <button data-action="new-board">+ Novo quadro</button>
    <div class="sidebar-footer">
      <button id="themeToggle">🌙</button>
    </div>
  </aside>
  <main id="main">
    <header id="topbar" class="hidden">
      <input id="boardTitleInput" placeholder="Nome do quadro">
      <div class="toolbar" id="boardTools">
        <input id="searchInput" placeholder="Buscar cartões...">
        <select id="filterLabel"><option value="">Todas etiquetas</option></select>
        <select id="filterPriority">
          <option value="">Toda prioridade</option>
          <option value="none">Sem prioridade</option>
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
          <option value="urgente">Urgente</option>
        </select>
        <select id="filterDue">
          <option value="">Todo prazo</option>
          <option value="atrasado">Atrasados</option>
          <option value="hoje">Hoje</option>
          <option value="semana">Essa semana</option>
          <option value="sem-prazo">Sem prazo</option>
        </select>
        <button id="clearFilters">Limpar filtros</button>
      </div>
    </header>
    <div id="boardLists"></div>
    <div id="emptyState" class="hidden">
      <p>Você ainda não tem nenhum quadro.</p>
      <button data-action="new-board">Criar meu primeiro quadro</button>
    </div>
  </main>
</div>

<div id="cardModalOverlay" class="overlay hidden"></div>

<script>
/* ===================== Mural — quadro Kanban local ===================== */
(function () {
  "use strict";

  /* ---------- utils ---------- */
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const todayStr = () => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  };
  const fmtDate = (iso) => {
    if (!iso) return "";
    const [y, m, d] = iso.split("-");
    return `${d}/${m}/${y}`;
  };

  const PRIORITIES = [
    { id: "none", label: "Sem prioridade", color: "var(--text-dim)" },
    { id: "baixa", label: "Baixa", color: "#4C7A9E" },
    { id: "media", label: "Média", color: "var(--accent-2)" },
    { id: "alta", label: "Alta", color: "#C5602E" },
    { id: "urgente", label: "Urgente", color: "var(--danger)" },
  ];
  const LABEL_COLORS = ["#2D6A63", "#B5702B", "#A3392F", "#5B4B8A", "#3E7A4A", "#4C7A9E", "#8A5B3F", "#6B6459"];

  /* ---------- IndexedDB layer ---------- */
  const DB_NAME = "muralDB";
  const DB_VERSION = 1;
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("boards")) db.createObjectStore("boards", { keyPath: "id" });
        if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function tx(storeName, mode) {
    const db = await openDB();
    return db.transaction(storeName, mode).objectStore(storeName);
  }

  async function dbGetAllBoards() {
    try {
      const store = await tx("boards", "readonly");
      return await new Promise((res, rej) => {
        const r = store.getAll();
        r.onsuccess = () => res(r.result || []);
        r.onerror = () => rej(r.error);
      });
    } catch (err) {
      console.error("Erro ao ler quadros:", err);
      return [];
    }
  }

  async function dbPutBoard(board) {
    try {
      const store = await tx("boards", "readwrite");
      await new Promise((res, rej) => {
        const r = store.put(board);
        r.onsuccess = () => res();
        r.onerror = () => rej(r.error);
      });
    } catch (err) {
      console.error("Erro ao salvar quadro:", err);
    }
  }

  async function dbDeleteBoard(id) {
    try {
      const store = await tx("boards", "readwrite");
      await new Promise((res, rej) => {
        const r = store.delete(id);
        r.onsuccess = () => res();
        r.onerror = () => rej(r.error);
      });
    } catch (err) {
      console.error("Erro ao excluir quadro:", err);
    }
  }

  async function dbGetMeta(key, fallback) {
    try {
      const store = await tx("meta", "readonly");
      return await new Promise((res, rej) => {
        const r = store.get(key);
        r.onsuccess = () => res(r.result ? r.result.value : fallback);
        r.onerror = () => rej(r.error);
      });
    } catch (err) {
      return fallback;
    }
  }

  async function dbPutMeta(key, value) {
    try {
      const store = await tx("meta", "readwrite");
      await new Promise((res, rej) => {
        const r = store.put({ key, value });
        r.onsuccess = () => res();
        r.onerror = () => rej(r.error);
      });
    } catch (err) {
      console.error("Erro ao salvar preferência:", err);
    }
  }

  /* ---------- state ---------- */
  const state = {
    boards: [],
    activeBoardId: null,
    theme: "light",
    filters: { text: "", labelId: "", priority: "", due: "" },
    dragging: null, // { type: 'card'|'list', id, el }
    openCardId: null,
    openListId: null,
  };

  function activeBoard() {
    return state.boards.find((b) => b.id === state.activeBoardId) || null;
  }

  function makeBoard(name) {
    return {
      id: uid(),
      name: name || "Novo quadro",
      labels: [
        { id: uid(), name: "Design", color: LABEL_COLORS[0] },
        { id: uid(), name: "Bug", color: LABEL_COLORS[2] },
      ],
      lists: [
        { id: uid(), name: "A fazer", cards: [] },
        { id: uid(), name: "Em andamento", cards: [] },
        { id: uid(), name: "Concluído", cards: [] },
      ],
    };
  }

  function makeCard(title) {
    return {
      id: uid(),
      title: title || "Novo cartão",
      desc: "",
      priority: "none",
      dueDate: "",
      done: false,
      labelIds: [],
      checklist: [],
      attachments: [],
    };
  }

  async function seedIfEmpty() {
    const boards = await dbGetAllBoards();
    if (boards.length > 0) {
      state.boards = boards;
      return;
    }
    const board = makeBoard("Meu quadro");
    const designLabel = board.labels[0].id;
    const card1 = makeCard("Arraste os cartões entre as colunas");
    card1.desc = "Clique em um cartão para abrir os detalhes: etiquetas, prioridade, checklist, prazo e imagens.";
    card1.labelIds = [designLabel];
    card1.priority = "media";
    card1.checklist = [
      { id: uid(), text: "Testar o modo escuro", done: false },
      { id: uid(), text: "Criar um novo quadro", done: false },
    ];
    const card2 = makeCard("Tudo fica salvo no seu navegador");
    card2.desc = "Os dados são gravados em IndexedDB — continuam aqui mesmo se você fechar a aba.";
    card2.priority = "baixa";
    const card3 = makeCard("Exemplo concluído");
    card3.done = true;
    card3.priority = "alta";
    board.lists[0].cards = [card1, card2];
    board.lists[2].cards = [card3];
    await dbPutBoard(board);
    state.boards = [board];
  }

  /* ---------- persistence helpers ---------- */
  function saveActiveBoard() {
    const b = activeBoard();
    if (b) dbPutBoard(b);
  }

  /* ---------- rendering ---------- */
  const sidebarTabsEl = () => $("#boardTabs");
  const boardListsEl = () => $("#boardLists");

  function render() {
    renderSidebar();
    renderTopbar();
    renderBoard();
  }

  function renderSidebar() {
    const el = sidebarTabsEl();
    if (state.boards.length === 0) {
      el.innerHTML = `<p class="empty-hint">Nenhum quadro ainda.</p>`;
      return;
    }
    el.innerHTML = state.boards
      .map(
        (b) => `
      <div class="board-tab ${b.id === state.activeBoardId ? "active" : ""}" data-action="select-board" data-board-id="${b.id}">
        <span class="tab-index">Nº ${String(state.boards.indexOf(b) + 1).padStart(2, "0")}</span>
        <span class="tab-name">${esc(b.name)}</span>
        <button class="icon-btn tab-del" data-action="delete-board" data-board-id="${b.id}" title="Excluir quadro" aria-label="Excluir quadro">✕</button>
      </div>`
      )
      .join("");
  }

  function renderTopbar() {
    const b = activeBoard();
    const titleInput = $("#boardTitleInput");
    const topbar = $("#topbar");
    const boardTools = $("#boardTools");
    if (!b) {
      topbar.classList.add("hidden");
      return;
    }
    topbar.classList.remove("hidden");
    boardTools.classList.remove("hidden");
    if (document.activeElement !== titleInput) titleInput.value = b.name;

    const labelSelect = $("#filterLabel");
    labelSelect.innerHTML =
      `<option value="">Todas etiquetas</option>` +
      b.labels.map((l) => `<option value="${l.id}" ${state.filters.labelId === l.id ? "selected" : ""}>${esc(l.name)}</option>`).join("");
  }

  function computeDueBadge(card) {
    if (!card.dueDate) return null;
    if (card.done) return { text: "Concluído", cls: "badge-done" };
    const today = todayStr();
    const diff = (new Date(card.dueDate) - new Date(today)) / 86400000;
    if (diff < 0) return { text: `Atrasado · ${fmtDate(card.dueDate)}`, cls: "badge-danger" };
    if (diff === 0) return { text: "Hoje", cls: "badge-warn" };
    if (diff <= 2) return { text: `Em ${Math.round(diff)}d`, cls: "badge-warn" };
    return { text: fmtDate(card.dueDate), cls: "badge-neutral" };
  }

  function cardMatchesFilters(card, board) {
    const f = state.filters;
    if (f.text) {
      const hay = (card.title + " " + card.desc).toLowerCase();
      if (!hay.includes(f.text.toLowerCase())) return false;
    }
    if (f.labelId && !card.labelIds.includes(f.labelId)) return false;
    if (f.priority && card.priority !== f.priority) return false;
    if (f.due) {
      const badge = computeDueBadge(card);
      if (f.due === "atrasado" && !(badge && badge.cls === "badge-danger")) return false;
      if (f.due === "hoje" && !(card.dueDate === todayStr() && !card.done)) return false;
      if (f.due === "semana") {
        if (!card.dueDate) return false;
        const diff = (new Date(card.dueDate) - new Date(todayStr())) / 86400000;
        if (diff < 0 || diff > 7) return false;
      }
      if (f.due === "sem-prazo" && card.dueDate) return false;
    }
    return true;
  }

  function renderCardFace(card, board) {
    const hidden = !cardMatchesFilters(card, board);
    const labels = card.labelIds.map((id) => board.labels.find((l) => l.id === id)).filter(Boolean);
    const badge = computeDueBadge(card);
    const checklistTotal = card.checklist.length;
    const checklistDone = card.checklist.filter((i) => i.done).length;
    const pr = PRIORITIES.find((p) => p.id === card.priority);
    const cover = card.attachments[0];

    return `
    <div class="card ${hidden ? "hidden" : ""} ${card.done ? "card-done" : ""}" draggable="true" data-card-id="${card.id}" data-action="open-card" tabindex="0">
      ${card.priority !== "none" ? `<span class="priority-flag" style="background:${pr.color}" title="Prioridade: ${pr.label}"></span>` : ""}
      ${cover ? `<img class="card-cover" src="${cover.dataUrl}" alt="">` : ""}
      <div class="card-body">
        ${labels.length ? `<div class="card-labels">${labels.map((l) => `<span class="chip" style="background:${l.color}">${esc(l.name)}</span>`).join("")}</div>` : ""}
        <p class="card-title">${esc(card.title)}</p>
        ${checklistTotal ? `<div class="card-checklist"><div class="progress"><div class="progress-fill" style="width:${(checklistDone / checklistTotal) * 100}%"></div></div><span class="checklist-count">${checklistDone}/${checklistTotal}</span></div>` : ""}
        <div class="card-meta">
          ${badge ? `<span class="badge ${badge.cls}">${badge.text}</span>` : ""}
          ${card.attachments.length ? `<span class="meta-pill">📎 ${card.attachments.length}</span>` : ""}
        </div>
      </div>
    </div>`;
  }

  function renderList(list, board) {
    const visibleCount = list.cards.filter((c) => cardMatchesFilters(c, board)).length;
    return `
    <div class="list-column" data-list-id="${list.id}">
      <div class="list-header">
        <span class="drag-handle" draggable="true" data-action="drag-list-handle" data-list-id="${list.id}" title="Arrastar lista">⠿</span>
        <input class="list-name-input" value="${esc(list.name)}" data-action="rename-list" data-list-id="${list.id}">
        <span class="list-count">Nº ${String(visibleCount).padStart(2, "0")}</span>
        <button class="icon-btn" data-action="delete-list" data-list-id="${list.id}" title="Excluir lista" aria-label="Excluir lista">✕</button>
      </div>
      <div class="list-cards" data-list-id="${list.id}">
        ${list.cards.map((c) => renderCardFace(c, board)).join("")}
      </div>
      <button class="add-card-btn" data-action="add-card" data-list-id="${list.id}">+ Adicionar cartão</button>
    </div>`;
  }

  function renderBoard() {
    const b = activeBoard();
    const el = boardListsEl();
    const emptyState = $("#emptyState");
    if (!b) {
      el.innerHTML = "";
      emptyState.classList.remove("hidden");
      return;
    }
    emptyState.classList.add("hidden");
    el.innerHTML = b.lists.map((l) => renderList(l, b)).join("") + `<button class="add-list-btn" data-action="add-list">+ Nova lista</button>`;
  }

  /* ---------- card modal ---------- */
  function renderCardModal() {
    const b = activeBoard();
    const overlay = $("#cardModalOverlay");
    if (!b || !state.openCardId) {
      overlay.classList.add("hidden");
      overlay.innerHTML = "";
      return;
    }
    let card, list;
    for (const l of b.lists) {
      const found = l.cards.find((c) => c.id === state.openCardId);
      if (found) {
        card = found;
        list = l;
        break;
      }
    }
    if (!card) {
      overlay.classList.add("hidden");
      return;
    }
    overlay.classList.remove("hidden");

    const checklistTotal = card.checklist.length;
    const checklistDone = card.checklist.filter((i) => i.done).length;

    overlay.innerHTML = `
    <div id="cardModal" role="dialog" aria-modal="true">
      <div class="modal-header">

      </div>
      <p class="modal-sub">na lista <strong>${esc(list.name)}</strong></p>

      <div class="modal-grid">
        <div class="modal-main">
          <label class="field-label">Descrição</label>
          <textarea id="cmDesc" rows="3" placeholder="Adicione uma descrição...">${esc(card.desc)}</textarea>

          <label class="field-label">Checklist ${checklistTotal ? `(${checklistDone}/${checklistTotal})` : ""}</label>
          ${checklistTotal ? `<div class="progress"><div class="progress-fill" style="width:${(checklistDone / checklistTotal) * 100}%"></div></div>` : ""}
          <div class="checklist-items">

              .map(

              <div class="checklist-item">

                <span class="${it.done ? "done" : ""}">${esc(it.text)}</span>
                <button class="icon-btn" data-action="delete-check" data-item-id="${it.id}" aria-label="Remover item">✕</button>

              )
              .join("")}
          </div>
          <form id="cmChecklistForm" class="inline-form">
            <input id="cmChecklistInput" placeholder="Adicionar item...">
            <button type="submit">Adicionar</button>
          </form>

          <label class="field-label">Imagens</label>
          <div class="attachments">
            ${card.attachments
              .map(
                (a) => `

              .join("")}

        </div>

        <div class="modal-side">

            ${PRIORITIES.map((p) => `<option value="${p.id}" ${card.priority === p.id ? "selected" : ""}>${p.label}</option>`).join("")}
          </select>

          <label class="field-label">Prazo</label>
          <input type="date" id="cmDueDate" value="${card.dueDate || ""}">
          <label class="checkbox-row">
            <input type="checkbox" id="cmDone" ${card.done ? "checked" : ""}>
            <span>Concluído</span>
          </label>

          <label class="field-label">Etiquetas</label>
          <div class="label-chips">
            ${b.labels
              .map(
                (l) => `
              <button type="button" class="chip-toggle ${card.labelIds.includes(l.id) ? "active" : ""}" style="--chip-color:${l.color}" data-action="toggle-label" data-label-id="${l.id}">
                <span class="chip-dot" style="background:${l.color}"></span>${esc(l.name)}

              .join("")}

            </div>
            <button type="submit">+ Criar etiqueta</button>
          </form>

          <button class="danger-btn" data-action="delete-card" data-card-id="${card.id}">Excluir cartão</button>
        </div>
      </div>
    </div>`;

    // wire modal-local events
    $("#cmTitle").addEventListener("input", (e) => {
      card.title = e.target.value;
      saveActiveBoard();
    });
    $("#cmTitle").addEventListener("blur", () => render());
    $("#cmDesc").addEventListener("input", (e) => {
      card.desc = e.target.value;
      saveActiveBoard();
    });
    $("#cmPriority").addEventListener("change", (e) => {
      card.priority = e.target.value;
      saveActiveBoard();
      render();
      renderCardModal();
    });
    $("#cmDueDate").addEventListener("change", (e) => {
      card.dueDate = e.target.value;
      saveActiveBoard();
      render();
      renderCardModal();
    });
    $("#cmDone").addEventListener("change", (e) => {
      card.done = e.target.checked;
      saveActiveBoard();
      render();
      renderCardModal();
    });
    $("#cmChecklistForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = $("#cmChecklistInput");
      const text = input.value.trim();
      if (!text) return;
      card.checklist.push({ id: uid(), text, done: false });
      input.value = "";
      saveActiveBoard();
      render();
      renderCardModal();
    });
    $("#cmFileInput").addEventListener("change", (e) => {
      const files = Array.from(e.target.files || []);
      let remaining = files.length;
      if (!remaining) return;
      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = () => {
          card.attachments.push({ id: uid(), name: file.name, dataUrl: reader.result });
          remaining--;
          if (remaining === 0) {
            saveActiveBoard();
            render();
            renderCardModal();
          }
        };
        reader.readAsDataURL(file);
      });
    });
    let selectedSwatch = LABEL_COLORS[0];
    $$("#cmSwatches .swatch").forEach((sw) => {
      sw.addEventListener("click", () => {
        selectedSwatch = sw.dataset.color;
        $$("#cmSwatches .swatch").forEach((s) => s.classList.remove("active"));
        sw.classList.add("active");
      });
    });
    $("#cmNewLabelForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = $("#cmNewLabelName");
      const name = input.value.trim();
      if (!name) return;
      const newLabel = { id: uid(), name, color: selectedSwatch };
      b.labels.push(newLabel);
      card.labelIds.push(newLabel.id);
      input.value = "";
      saveActiveBoard();
      render();
      renderCardModal();
    });
  }

  /* ---------- drag & drop sync ---------- */
  function getDragAfterElement(container, coord, axis, draggingEl) {
    const selector = axis === "y" ? ".card:not(.dragging)" : ".list-column:not(.dragging)";
    const els = $$(selector, container).filter((el) => el !== draggingEl);
    let closest = { offset: -Infinity, el: null };
    for (const el of els) {
      const box = el.getBoundingClientRect();
      const center = axis === "y" ? box.top + box.height / 2 : box.left + box.width / 2;
      const offset = coord - center;
      if (offset < 0 && offset > closest.offset) closest = { offset, el };
    }
    return closest.el;
  }

  function commitDragToState() {
    const b = activeBoard();
    if (!b) return;
    const allCards = {};
    b.lists.forEach((l) => l.cards.forEach((c) => (allCards[c.id] = c)));
    const listEls = $$(".list-column", boardListsEl());
    const newLists = listEls.map((listEl) => {
      const listId = listEl.dataset.listId;
      const oldList = b.lists.find((l) => l.id === listId);
      const cardEls = $$(".card", listEl);
      const cards = cardEls.map((ce) => allCards[ce.dataset.cardId]).filter(Boolean);
      return { id: listId, name: oldList ? oldList.name : "Lista", cards };
    });
    b.lists = newLists;
    saveActiveBoard();
  }

  function attachDragHandlers() {
    const container = boardListsEl();

    container.addEventListener("dragstart", (e) => {
      const cardEl = e.target.closest(".card");
      const handleEl = e.target.closest('[data-action="drag-list-handle"]');
      if (cardEl) {
        state.dragging = { type: "card", el: cardEl };
        cardEl.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", cardEl.dataset.cardId);
      } else if (handleEl) {
        const listEl = handleEl.closest(".list-column");
        state.dragging = { type: "list", el: listEl };
        listEl.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", listEl.dataset.listId);
        try {
          e.dataTransfer.setDragImage(listEl, 20, 20);
        } catch (err) {}
      }
    });

    container.addEventListener("dragover", (e) => {
      if (!state.dragging) return;
      e.preventDefault();
      if (state.dragging.type === "card") {
        const listCards = e.target.closest(".list-cards");
        if (!listCards) return;
        const after = getDragAfterElement(listCards, e.clientY, "y", state.dragging.el);
        if (after) listCards.insertBefore(state.dragging.el, after);
        else listCards.appendChild(state.dragging.el);
      } else if (state.dragging.type === "list") {
        const after = getDragAfterElement(container, e.clientX, "x", state.dragging.el);
        const addBtn = $(".add-list-btn", container);
        if (after) container.insertBefore(state.dragging.el, after);
        else container.insertBefore(state.dragging.el, addBtn);
      }
    });

    container.addEventListener("dragend", (e) => {
      if (!state.dragging) return;
      state.dragging.el.classList.remove("dragging");
      commitDragToState();
      state.dragging = null;
      render();
    });
  }

  /* ---------- actions / event delegation ---------- */
  function addBoard() {
    const board = makeBoard("Novo quadro " + (state.boards.length + 1));
    state.boards.push(board);
    state.activeBoardId = board.id;
    dbPutBoard(board);
    dbPutMeta("activeBoardId", board.id);
    render();
  }

  async function deleteBoard(id) {
    if (!confirm("Excluir este quadro e todos os seus cartões? Essa ação não pode ser desfeita.")) return;
    state.boards = state.boards.filter((b) => b.id !== id);
    await dbDeleteBoard(id);
    if (state.activeBoardId === id) {
      state.activeBoardId = state.boards[0] ? state.boards[0].id : null;
      dbPutMeta("activeBoardId", state.activeBoardId);
    }
    render();
  }

  function addList() {
    const b = activeBoard();
    if (!b) return;
    b.lists.push({ id: uid(), name: "Nova lista", cards: [] });
    saveActiveBoard();
    render();
  }

  function deleteList(listId) {
    const b = activeBoard();
    if (!b) return;
    if (!confirm("Excluir esta lista e todos os seus cartões?")) return;
    b.lists = b.lists.filter((l) => l.id !== listId);
    saveActiveBoard();
    render();
  }

  function addCard(listId) {
    const b = activeBoard();
    if (!b) return;
    const list = b.lists.find((l) => l.id === listId);
    if (!list) return;
    const card = makeCard("Novo cartão");
    list.cards.push(card);
    saveActiveBoard();
    state.openCardId = card.id;
    render();
    renderCardModal();
  }

  function deleteCard(cardId) {
    const b = activeBoard();
    if (!b) return;
    if (!confirm("Excluir este cartão?")) return;
    b.lists.forEach((l) => (l.cards = l.cards.filter((c) => c.id !== cardId)));
    saveActiveBoard();
    state.openCardId = null;
    render();
    renderCardModal();
  }

  function findCard(cardId) {
    const b = activeBoard();
    if (!b) return null;
    for (const l of b.lists) {
      const c = l.cards.find((c) => c.id === cardId);
      if (c) return c;
    }
    return null;
  }

  function setTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    dbPutMeta("theme", theme);
    $("#themeToggle").textContent = theme === "dark" ? "☀️" : "🌙";
  }

  function wireGlobalEvents() {
    document.body.addEventListener("click", (e) => {
      const t = e.target.closest("[data-action]");
      if (!t) return;
      const action = t.dataset.action;
      switch (action) {
        case "select-board":
          state.activeBoardId = t.dataset.boardId;
          dbPutMeta("activeBoardId", state.activeBoardId);
          render();
          break;
        case "delete-board":
          e.stopPropagation();
          deleteBoard(t.dataset.boardId);
          break;
        case "new-board":
          addBoard();
          break;
        case "add-list":
          addList();
          break;
        case "delete-list":
          deleteList(t.dataset.listId);
          break;
        case "add-card":
          addCard(t.dataset.listId);
          break;
        case "open-card":
          if (state.dragging) return;
          state.openCardId = t.dataset.cardId;
          renderCardModal();
          break;
        case "close-card":
          state.openCardId = null;
          renderCardModal();
          render();
          break;
        case "delete-card":
          deleteCard(t.dataset.cardId);
          break;
        case "toggle-check": {
          const card = findCard(state.openCardId);
          const item = card.checklist.find((i) => i.id === t.dataset.itemId);
          item.done = t.checked;
          saveActiveBoard();
          render();
          renderCardModal();
          break;
        }
        case "delete-check": {
          const card = findCard(state.openCardId);
          card.checklist = card.checklist.filter((i) => i.id !== t.dataset.itemId);
          saveActiveBoard();
          render();
          renderCardModal();
          break;
        }
        case "delete-attachment": {
          const card = findCard(state.openCardId);
          card.attachments = card.attachments.filter((a) => a.id !== t.dataset.attId);
          saveActiveBoard();
          render();
          renderCardModal();
          break;
        }
        case "toggle-label": {
          const card = findCard(state.openCardId);
          const lid = t.dataset.labelId;
          if (card.labelIds.includes(lid)) card.labelIds = card.labelIds.filter((id) => id !== lid);
          else card.labelIds.push(lid);
          saveActiveBoard();
          render();
          renderCardModal();
          break;
        }
      }
    });

    document.body.addEventListener("change", (e) => {
      if (e.target.id === "cmFileInput") return; // handled locally in modal render
    });

    // checkbox toggle via delegation (input[type=checkbox] click doesn't bubble as "click" with dataset always reliable, so use change)
    document.body.addEventListener("change", (e) => {
      if (e.target.matches('[data-action="toggle-check"]')) {
        const card = findCard(state.openCardId);
        if (!card) return;
        const item = card.checklist.find((i) => i.id === e.target.dataset.itemId);
        if (item) item.done = e.target.checked;
        saveActiveBoard();
        render();
        renderCardModal();
      }
    });

    $("#boardTitleInput").addEventListener("input", (e) => {
      const b = activeBoard();
      if (!b) return;
      b.name = e.target.value;
      saveActiveBoard();
      renderSidebar();
    });

    boardListsEl().addEventListener(
      "change",
      (e) => {
        if (e.target.matches(".list-name-input")) {
          const b = activeBoard();
          const list = b.lists.find((l) => l.id === e.target.dataset.listId);
          if (list) {
            list.name = e.target.value.trim() || "Lista";
            saveActiveBoard();
          }
        }
      },
      true
    );

    $("#themeToggle").addEventListener("click", () => {
      setTheme(state.theme === "dark" ? "light" : "dark");
    });

    $("#searchInput").addEventListener("input", (e) => {
      state.filters.text = e.target.value;
      render();
    });
    $("#filterLabel").addEventListener("change", (e) => {
      state.filters.labelId = e.target.value;
      render();
    });
    $("#filterPriority").addEventListener("change", (e) => {
      state.filters.priority = e.target.value;
      render();
    });
    $("#filterDue").addEventListener("change", (e) => {
      state.filters.due = e.target.value;
      render();
    });
    $("#clearFilters").addEventListener("click", () => {
      state.filters = { text: "", labelId: "", priority: "", due: "" };
      $("#searchInput").value = "";
      $("#filterLabel").value = "";
      $("#filterPriority").value = "";
      $("#filterDue").value = "";
      render();
    });

    $("#cardModalOverlay").addEventListener("click", (e) => {
      if (e.target.id === "cardModalOverlay") {
        state.openCardId = null;
        renderCardModal();
        render();
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && state.openCardId) {
        state.openCardId = null;
        renderCardModal();
        render();
      }
    });

    attachDragHandlers();
  }

  /* ---------- init ---------- */
  async function init() {
    const savedTheme = await dbGetMeta("theme", null);
    setTheme(savedTheme || "light");
    await seedIfEmpty();
    const savedActive = await dbGetMeta("activeBoardId", null);
    state.activeBoardId = state.boards.find((b) => b.id === savedActive) ? savedActive : state.boards[0]?.id || null;
    wireGlobalEvents();
    render();
  }

  document.addEventListener("DOMContentLoaded", init);

  /* ---------- PWA: registro do service worker ---------- */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.error("Falha ao registrar o service worker:", err);
      });
    });
  }
})();

</script>
</body>
</html>
