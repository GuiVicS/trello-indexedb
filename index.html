<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarefas — gestor de tarefas local</title>
<meta name="description" content="Gestor de tarefas local (estilo Trello + Notion), 100% offline via IndexedDB.">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarefas">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><i data-lucide="check-check"></i> <span>Tarefas</span></div>

    <div id="workspaceSwitch">
      <button id="workspaceBtn"><i data-lucide="briefcase"></i><span class="ws-name">—</span><i data-lucide="chevron-down"></i></button>
      <div id="workspaceMenu" class="hidden"></div>
    </div>

    <nav id="navLinks">
      <a class="nav-link" data-view="board"><i data-lucide="columns-3"></i> Quadro</a>
      <a class="nav-link" data-view="table"><i data-lucide="table"></i> Tabela</a>
      <a class="nav-link" data-view="calendar"><i data-lucide="calendar-days"></i> Calendário</a>
      <a class="nav-link" data-view="reports"><i data-lucide="file-text"></i> Relatórios</a>
    </nav>

    <div class="sidebar-footer">
      <button class="sidebar-btn" id="searchOpenBtn"><i data-lucide="search"></i> Buscar <span style="margin-left:auto;font-size:11px;color:var(--text-dim)">Ctrl+K</span></button>
      <button class="sidebar-btn" id="themeToggleBtn"><i data-lucide="moon"></i> Alternar tema</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar"></header>
    <div id="viewArea"></div>
  </main>
</div>

<div id="taskOverlay" class="overlay hidden"></div>
<div id="searchOverlay" class="hidden">
  <div id="searchModal">
    <div id="searchInputRow">
      <i data-lucide="search"></i>
      <input id="searchInput" placeholder="Buscar tarefas por título ou conteúdo...">
    </div>
    <div id="searchResults"></div>
    <div id="searchFooter">
      <span><kbd>↑↓</kbd>navegar</span>
      <span><kbd>Enter</kbd>abrir</span>
      <span><kbd>Esc</kbd>fechar</span>
    </div>
  </div>
</div>
<div id="wsFormOverlay" class="simple-overlay hidden"></div>
<input type="file" id="hiddenFileInput" style="display:none" multiple>

<script type="module" src="/src/main.js"></script>
</body>
</html>
